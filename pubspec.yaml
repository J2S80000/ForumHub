name: forumhub
description: "ForumHub - A Flutter forum aggregator app."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.3.0
  google_fonts: ^6.2.1
  url_launcher: ^6.3.1
  rss_dart: ^1.0.13
  http: ^1.1.0
  file_picker: ^10.3.3
  path_provider: ^2.0.17
  open_file: ^3.2.1
  html: ^0.15.4
  provider: ^6.0.5
  xml: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
